<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef1f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0c12" media="(prefers-color-scheme: dark)">
<title>拾光 Glint</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="fluid" aria-hidden="true">
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i>
  <div class="grain"></div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="liquid" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="7" result="n"/>
    <feGaussianBlur in="n" stdDeviation="2" result="nb"/>
    <feDisplacementMap in="SourceGraphic" in2="nb" scale="18" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<header class="bar">
  <a class="brand" href="/" aria-label="拾光 Glint">
    <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7aa7ff"/><stop offset=".55" stop-color="#b48cff"/><stop offset="1" stop-color="#ff8fc7"/></linearGradient></defs><rect x="3" y="3" width="26" height="26" rx="8" fill="url(#lg)"/><path d="M16 9v10m0 0-4-4m4 4 4-4M10.5 23h11" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    <span data-i="brand">拾光</span><em>Glint</em>
  </a>
  <div class="tools glass-pill lens">
    <button class="icon" id="theme" type="button" data-i-title="theme" title="深浅色"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg></button>
    <button class="txt" id="lang" type="button" data-t="lang">EN</button>
  </div>
</header>

<main>
  <section class="hero">
    <h1 data-i="h1">把喜欢的瞬间，<br class="m">留在自己手里</h1>
    <p data-i="sub">粘贴链接或整段分享文案，挑清晰度和格式，存下视频、音乐与图片。</p>
  </section>

  <section class="panel glass" data-t="panel" id="panel">
    <div class="spec" aria-hidden="true"></div>

    <form id="gate" class="capsule hide" autocomplete="off">
      <span class="lead"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/></svg></span>
      <input data-t="code" id="code" type="password" inputmode="text" data-i-ph="codePh" placeholder="输入访问口令">
      <button class="go" data-t="login" id="loginBtn" type="submit"><span data-i="enter">进入</span></button>
    </form>

    <form id="offline" class="offline hide" autocomplete="off">
      <h3 data-i="offTitle">还没连上你的电脑</h3>
      <p id="offmsg"></p>
      <div class="capsule">
        <span class="lead"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2.5"/><path d="M8 20h8M12 16v4"/></svg></span>
        <input id="apiurl" type="text" inputmode="url" spellcheck="false" data-i-ph="apiPh" placeholder="也可以把窗口里的链接粘贴到这里">
        <button class="go" type="submit"><span data-i="connect">连接</span></button>
      </div>
    </form>

    <form id="search" class="capsule" autocomplete="off">
      <span class="lead"><svg viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg></span>
      <input data-t="url" id="url" type="text" inputmode="url" enterkeyhint="go" spellcheck="false" data-i-ph="urlPh" placeholder="粘贴链接或分享文案">
      <button class="paste" id="paste" type="button" data-i="paste">粘贴</button>
      <button class="go" data-t="go" id="go" type="submit"><span class="spin"></span><span data-i="go">解析</span></button>
    </form>

    <div class="sites" id="sites">
      <span class="site yt"><svg viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path class="f" d="m10 9 5 3-5 3z"/></svg>YouTube</span>
      <span class="site bili"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="3.5"/><path d="m8 3.5 2.5 3M16 3.5l-2.5 3M8.5 12.5v1.5M15.5 12.5v1.5"/></svg><span data-i="bili">B站</span></span>
      <span class="site tt"><svg viewBox="0 0 24 24"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.5 2.6 2.4 4.4 5 4.6"/></svg>TikTok</span>
      <span class="site ig"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="3.8"/><circle class="f" cx="17" cy="7" r="1"/></svg>Instagram</span>
      <span class="site more" data-i="more">+ 上千个网站</span>
    </div>

    <div class="err hide" data-t="error" id="err" role="alert"></div>

    <div class="result hide" data-t="result" id="result">
      <div class="rhead">
        <div>
          <span class="badge" id="plat"></span>
          <h2 data-t="title" id="title"></h2>
        </div>
        <button class="ghost hide" id="all" type="button" data-i="all">全部图片</button>
      </div>
      <div class="items" id="items"></div>
    </div>
  </section>

  <footer>
    <p data-i="foot">只下载你有权保存的内容 · 不记录你粘贴的链接</p>
  </footer>
</main>

<template id="tpl-item">
  <article class="item glass-soft" data-t="item">
    <div class="thumb"><img alt="" loading="lazy"><span class="dur"></span><span class="dims"></span></div>
    <div class="body">
      <h3 class="ititle"></h3>
      <div class="seg kinds" role="tablist"></div>
      <div class="row qrow"><span class="lbl" data-i="quality">清晰度</span><div class="chips quals"></div></div>
      <div class="row"><span class="lbl" data-i="format">格式</span><div class="chips fmts"></div></div>
      <p class="hint"></p>
      <button class="dl" data-t="download" type="button"><span class="bar-fill"></span><span class="dl-txt"></span></button>
    </div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
